<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body {
      margin: 0;
      padding: 0;
      width: 29.7cm;
      height: 21cm;
      font-family: '', serif;
    }
    .certificate-container {
      box-sizing: border-box;
      background: url("{{ background_image_uri }}") center/cover no-repeat;
      width: 27.7cm;
      height: 19cm;
      margin: 1cm auto;
      padding: 1.5cm 2cm;
      border: 8px solid #d4af37;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .cert-header {
      text-align: center;
    }
    .cert-header h1 {
      font-size: 50px;
      margin: 0;
      color: #fff;
      letter-spacing: 3px;
    }
    .cert-header h2 {
      font-size: 26px;
      margin: 8px 0;
      color: #d4af37;
    }
    .cert-body {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1cm;
    }
    .cert-body .field-label {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 4px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-align: center;
      /* shadow agar makin kontras */
      text-shadow: 1px 1px 4px #44444490;
    }
    .cert-body .field-value {
      font-size: 34px;
      color: #fff;
      margin-bottom: 18px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 1px;
      text-shadow: 2px 2px 5px #44444470;
      background: rgba(0,0,0,0.09);
      border-radius: 7px;
      display: inline-block;
      padding: 2px 16px;
      text-align: center;
    }
    .cert-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }
    .footer-left, .footer-right {
      text-align: center;
    }
    .footer-left img {
      width: 100px;
      height: 100px;
    }
    .footer-left .qr-label {
      margin-top: 6px;
      font-size: 14px;
      color: #ddd;
    }
    .footer-right .sign-image {
      display: block;
      margin: 0 auto -30px auto;
      width: 170px;
      height: 65px;
      object-fit: contain;
      background: transparent;
    }
    .footer-right .sign-name {
      margin-top: 6px;
      margin-bottom: 6px;
      font-size: 18px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      text-shadow: 1px 1px 4px #44444490;
    }
    .footer-right .sign-box {
      border-top: 2px solid #fff;
      width: 220px;
      height: 0;
      margin-top: 40px;
    }
    .position-ag{
      color: #fff;
      font-size: 12px;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <div class="certificate-container">
    <div class="cert-header">
      <h1>SERTIFIKAT</h1>
      <h2>KELULUSAN</h2>
    </div>
    <div class="cert-body">
      <div class="field-label">Nama:</div>
      <div class="field-value">{{ sertifikat.pemilik.nama_lengkap }}</div>

      <div class="field-label">Spesialis:</div>
      <div class="field-value">{{ sertifikat.spesialis }}</div>

      <div class="field-label">Tanggal Terbit:</div>
      <div class="field-value" style="font-size:24px; font-weight:normal;">{{ sertifikat.tanggal_terbit.strftime('%d %B %Y') }}</div>

      <div class="field-label">ID Sertifikat:</div>
      <div class="field-value" style="font-size:24px; font-weight:normal;">{{ sertifikat.id_sertifikat }}</div>
    </div>
    <div class="cert-footer">
      <div class="footer-left">
        <img src="data:image/png;base64,{{ qr_code_img_b64 }}" alt="QR Code Signature">
        <div class="qr-label">s.id/agreemusik</div>
      </div>
      <div class="footer-right">
        <img src="{{ signature_image_uri }}" alt="TTD" class="sign-image">
        <div class="sign-box"></div>
        <div class="sign-name">{{ sertifikat.penandatangan }}</div>
        <div class="position-ag">DIREKTUR AGREE MUSIK</div>
      </div>
    </div>
  </div>
</body>
</html>
